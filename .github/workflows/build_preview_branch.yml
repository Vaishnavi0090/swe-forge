name: Build preview branch
# NOTE (fork): upstream Open SWE runs this workflow automatically, but it depends on
# LangChain-owned infrastructure (a `preview` deployment branch and its GKE environment). On a fork that always fails, so it is
# manual-only here. Re-enable the original trigger only if you provide those.

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
  # Upstream triggers (disabled on this fork):
  # push:
  #   branches: ["main"]
  # pull_request_target:
  #   types: [labeled, unlabeled, synchronize, reopened, closed]

concurrency:
  group: build-preview-branch
  cancel-in-progress: false

jobs:
  build:
    name: Rebuild preview from main + labeled PRs
    if: >-
      github.event_name != 'pull_request_target'
      || contains(github.event.pull_request.labels.*.name, 'preview')
      || github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    steps:
      # Always main's copy of the script — never the PR's.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Rebuild preview branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: ./scripts/build_preview_branch.sh
